<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }

        .container {
            background-color: rgba(211, 211, 211, 0.9);
            /* Gray background with transparency */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            width: 400px;
            text-align: center;
            z-index: 2;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            text-align: left;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            background-color: #000;
            /* Black background */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #7D7D7D;
            /* Lighter gray */
        }

        .link {
            display: block;
            margin-top: 15px;
            color: #1E90FF;
            /* Link color */
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }

        /* Full-screen image background */
        img.bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
    </style>
</head>

<body>
    <img src="img/login_bg_image.jpg" alt="Background Image" class="bg-image">

    <div class="container">
        <form id="loginForm">
  <h1>Login Page</h1>

  <label>Username:</label>
  <input type="text" name="username" required>

  <label>Password:</label>
  <input type="password" name="password" required>

  <button type="submit">Login</button>

  <a href="registration.html" class="link">Does not have an account? Click Here</a>
</form>
    </div>

<script>
document.querySelector("#loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const username = document.querySelector("input[name='username']").value;
  const password = document.querySelector("input[name='password']").value;

  try {
    const res = await fetch("http://localhost:5000/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.status === 200) {
      alert(data.message);
      window.location.href = "index.html"; // redirect after login
    } else {
      alert(data.message);
    }

  } catch (error) {
    console.error(error);
    alert("❌ Login error");
  }
});
</script>

</body>

</html>
